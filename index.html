<header><div><h1>映框 <small>YINGKUANG</small></h1><small>为照片留一点空间</small></div><div class="headerActions"><button id="fullPreview" type="button">全屏预览</button><button class="primary" id="topExport">导出照片</button></div></header><main class="layout"><section><div class="preview"><canvas id="canvas" width="720" height="900"></canvas></div><p class="hint" style="padding:0 15px">可在画布上拖动文字或 PNG 水印。图片仅在本机处理。</p></section><nav id="toolTabs" aria-label="编辑工具"><button class="active" data-tab="0">照片</button><button data-tab="1">边框</button><button data-tab="2">文字</button><button data-tab="3">水印</button><button data-tab="4">模板/导出</button></nav><aside class="panel">
<div class="group"><h2>01 / 照片</h2><div class="buttons"><label class="upload primary" for="photo">导入照片</label><label class="upload" for="wmFile">导入 PNG</label></div><input class="hidden" id="photo" type="file" accept="image/*"><input class="hidden" id="wmFile" type="file" accept="image/png,image/*"></div>
<div class="group"><h2>02 / 画布与边框</h2><label>画布比例</label><select id="ratio"><option value="original">原图比例</option><option value="1">1 : 1</option><option value=".75">3 : 4</option><option value=".8" selected>4 : 5</option><option value=".5625">9 : 16</option><option value="1.5">3 : 2</option></select><label>边框颜色</label><div class="colorEditor"><div class="colorSwatches" data-target="bg"><button type="button" class="swatch" data-color="#FFFFFF" style="--swatch:#FFFFFF" aria-label="#FFFFFF"></button><button type="button" class="swatch" data-color="#F7F6F2" style="--swatch:#F7F6F2" aria-label="#F7F6F2"></button><button type="button" class="swatch" data-color="#E8E2D7" style="--swatch:#E8E2D7" aria-label="#E8E2D7"></button><button type="button" class="swatch" data-color="#D4C4AE" style="--swatch:#D4C4AE" aria-label="#D4C4AE"></button><button type="button" class="swatch" data-color="#222222" style="--swatch:#222222" aria-label="#222222"></button><button type="button" class="swatch" data-color="#000000" style="--swatch:#000000" aria-label="#000000"></button><button type="button" class="swatch" data-color="#9C9C9C" style="--swatch:#9C9C9C" aria-label="#9C9C9C"></button><button type="button" class="swatch" data-color="#7B8C75" style="--swatch:#7B8C75" aria-label="#7B8C75"></button><button type="button" class="swatch" data-color="#8CA6BA" style="--swatch:#8CA6BA" aria-label="#8CA6BA"></button><button type="button" class="swatch" data-color="#C7A5A5" style="--swatch:#C7A5A5" aria-label="#C7A5A5"></button><button type="button" class="swatch" data-color="#CBAA6C" style="--swatch:#CBAA6C" aria-label="#CBAA6C"></button><button type="button" class="swatch" data-color="#7D6B93" style="--swatch:#7D6B93" aria-label="#7D6B93"></button></div><div class="photoPalette"><div class="paletteHeading"><strong>照片智能配色</strong><button type="button" id="refreshPalette">重新提取</button></div><p class="paletteHelp">导入照片后自动识别主要颜色，点击色块应用到边框</p><div id="photoPaletteSwatches" class="photoPaletteSwatches"><span class="paletteEmpty">导入照片后显示配色</span></div></div><div class="pickerControls"><button id="openPicker" type="button">自由取色器</button><button id="samplePhoto" type="button">从照片吸色</button></div><div id="pickerPanel" class="pickerPanel" hidden><canvas id="svPicker" width="320" height="180" aria-label="选择饱和度和明度"></canvas><label>色相 <span id="hueLabel">0°</span></label><input id="hueSlider" type="range" min="0" max="360" value="0"></div><div class="hexRow"><span>HEX</span><input id="bg" class="hexInput" type="text" maxlength="7" spellcheck="false" value="#FFFFFF"><span class="colorPreview" id="bgPreview"></span></div></div><label>边框留白 <span id="marginV"></span></label><input id="margin" type="range" min="0" max="35" value="8"><label>照片缩放 <span id="zoomV"></span></label><input id="zoom" type="range" min="100" max="200" value="100"><label>照片水平位置</label><input id="photoX" type="range" min="-100" max="100" value="0"><label>照片垂直位置</label><input id="photoY" type="range" min="-100" max="100" value="0"></div>
<div class="group"><h2>03 / 文字排版</h2><label>自定义文案</label><textarea id="caption">PHOTO JOURNAL</textarea><label>字体</label><select id="font"><option value="sans">现代黑体</option><option value="serif">经典宋体</option><option value="mono">等宽字体</option><option value="english">英文衬线体</option></select><label>字号 <span id="sizeV"></span></label><input id="size" type="range" min="12" max="100" value="28"><label>字距 <span id="spacingV"></span></label><input id="spacing" type="range" min="0" max="20" value="2"><label>文字颜色</label><div class="colorEditor"><div class="colorSwatches" data-target="textColor"><button type="button" class="swatch" data-color="#FFFFFF" style="--swatch:#FFFFFF" aria-label="#FFFFFF"></button><button type="button" class="swatch" data-color="#F7F6F2" style="--swatch:#F7F6F2" aria-label="#F7F6F2"></button><button type="button" class="swatch" data-color="#E8E2D7" style="--swatch:#E8E2D7" aria-label="#E8E2D7"></button><button type="button" class="swatch" data-color="#D4C4AE" style="--swatch:#D4C4AE" aria-label="#D4C4AE"></button><button type="button" class="swatch" data-color="#222222" style="--swatch:#222222" aria-label="#222222"></button><button type="button" class="swatch" data-color="#000000" style="--swatch:#000000" aria-label="#000000"></button><button type="button" class="swatch" data-color="#9C9C9C" style="--swatch:#9C9C9C" aria-label="#9C9C9C"></button><button type="button" class="swatch" data-color="#7B8C75" style="--swatch:#7B8C75" aria-label="#7B8C75"></button><button type="button" class="swatch" data-color="#8CA6BA" style="--swatch:#8CA6BA" aria-label="#8CA6BA"></button><button type="button" class="swatch" data-color="#C7A5A5" style="--swatch:#C7A5A5" aria-label="#C7A5A5"></button><button type="button" class="swatch" data-color="#CBAA6C" style="--swatch:#CBAA6C" aria-label="#CBAA6C"></button><button type="button" class="swatch" data-color="#7D6B93" style="--swatch:#7D6B93" aria-label="#7D6B93"></button></div><div class="hexRow"><span>HEX</span><input id="textColor" class="hexInput" type="text" maxlength="7" spellcheck="false" value="#252525"><span class="colorPreview" id="textColorPreview"></span></div></div><label>文字水平位置</label><input id="textX" type="range" min="0" max="100" value="50"><label>文字垂直位置</label><input id="textY" type="range" min="0" max="100" value="95"><label>文字对齐</label><select id="align"><option value="center">居中</option><option value="left">左对齐</option><option value="right">右对齐</option></select></div>
<div class="group"><h2>04 / PNG 水印</h2><label>水印大小 <span id="wmSizeV"></span></label><input id="wmSize" type="range" min="5" max="100" value="35"><label>透明度 <span id="opacityV"></span></label><input id="opacity" type="range" min="0" max="100" value="100"><label>水印水平位置</label><input id="wmX" type="range" min="0" max="100" value="50"><label>水印垂直位置</label><input id="wmY" type="range" min="0" max="100" value="50"><button id="removeWm">移除水印</button></div>
<div class="group"><h2>05 / 模板与导出</h2><label>模板名称</label><input id="templateName" type="text" placeholder="例如：极简白边"><div class="buttons" style="margin-top:10px"><button id="saveTemplate">保存模板</button><button id="deleteTemplate">删除模板</button></div><label>我的模板</label><select id="templates"><option value="">选择模板</option></select><p class="hint">模板只保存排版设置，不保存原照片及 PNG 文件。</p><label>导出格式</label><select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select><label>导出长边像素</label><select id="resolution"><option value="2048">2048 px</option><option value="3072">3072 px</option><option value="4096" selected>4096 px</option><option value="original">原图长边（最多6000px）</option></select><button class="primary" id="export" style="width:100%;margin-top:15px">高清导出照片</button><p class="hint" id="status" role="status"></p></div></aside></main>
<script>
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');let photo=null,wm=null,drag=null,hit={};const ids=['ratio','bg','margin','zoom','photoX','photoY','caption','font','size','spacing','textColor','textX','textY','align','wmSize','opacity','wmX','wmY'],fonts={sans:'-apple-system,"PingFang SC",sans-serif',serif:'"Songti SC",serif',mono:'"Courier New",monospace',english:'Georgia,serif'};
function load(file){return new Promise((ok,no)=>{let u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>{URL.revokeObjectURL(u);no(Error('图片读取失败'))};i.src=u})}
function ratio(){return $('ratio').value==='original'?(photo?photo.naturalWidth/photo.naturalHeight:.8):+$('ratio').value}
function spaced(g,s,x,y,sp,align){let a=Array.from(s),width=a.reduce((n,ch,i)=>n+g.measureText(ch).width+(i?sp:0),0),p=x-(align==='center'?width/2:align==='right'?width:0);a.forEach(ch=>{g.fillText(ch,p,y);p+=g.measureText(ch).width+sp});return width}
function draw(g,w,h,preview=false){g.clearRect(0,0,w,h);g.fillStyle=$('bg').value;g.fillRect(0,0,w,h);let m=+$('margin').value/100*Math.min(w,h),b={x:m,y:m,w:w-2*m,h:h-2*m};if(photo){let scale=Math.min(b.w/photo.naturalWidth,b.h/photo.naturalHeight)*+$('zoom').value/100,pw=photo.naturalWidth*scale,ph=photo.naturalHeight*scale,x=b.x+(b.w-pw)/2+(+$('photoX').value/100)*b.w/2,y=b.y+(b.h-ph)/2+(+$('photoY').value/100)*b.h/2;g.save();g.beginPath();g.rect(b.x,b.y,b.w,b.h);g.clip();g.drawImage(photo,x,y,pw,ph);g.restore()}else{g.fillStyle='#aaa';g.textAlign='center';g.font=Math.round(w*.025)+'px sans-serif';g.fillText('点击「导入照片」开始创作',w/2,h/2)}
let fs=+$('size').value/900*w,sp=+$('spacing').value/900*w,tx=w*+$('textX').value/100,ty=h*+$('textY').value/100,lines=$('caption').value.split('\n'),lh=fs*1.35;g.fillStyle=$('textColor').value;g.textAlign='left';g.textBaseline='middle';g.font=fs+'px '+fonts[$('font').value];let maxWidth=0;lines.forEach((s,i)=>{maxWidth=Math.max(maxWidth,spaced(g,s,tx,ty+(i-(lines.length-1)/2)*lh,sp,$('align').value))});if(preview)hit.text={x:tx-maxWidth/2-20,y:ty-lh*lines.length/2-10,w:maxWidth+40,h:lh*lines.length+20};if(wm){let ww=w*+$('wmSize').value/100,wh=ww*wm.naturalHeight/wm.naturalWidth,x=w*+$('wmX').value/100-ww/2,y=h*+$('wmY').value/100-wh/2;g.save();g.globalAlpha=+$('opacity').value/100;g.drawImage(wm,x,y,ww,wh);g.restore();if(preview)hit.wm={x,y,w:ww,h:wh}}else if(preview)hit.wm=null}
function update(){let r=ratio(),n=900;c.width=r>=1?n:Math.round(n*r);c.height=r>=1?Math.round(n/r):n;draw(ctx,c.width,c.height,true);['margin','zoom','size','spacing','wmSize','opacity'].forEach(k=>{const n=$(k+'V');if(n)n.textContent=$(k).value+(['margin','zoom','wmSize','opacity'].includes(k)?'%':'')})}
ids.forEach(k=>$(k).addEventListener('input',update));$('photo').onchange=async e=>{if(e.target.files[0])try{photo=await load(e.target.files[0]);update()}catch(x){alert(x.message)}};$('wmFile').onchange=async e=>{if(e.target.files[0])try{wm=await load(e.target.files[0]);update()}catch(x){alert(x.message)}};$('removeWm').onclick=()=>{wm=null;$('wmFile').value='';update()};
